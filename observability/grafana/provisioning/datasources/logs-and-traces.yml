apiVersion: 1

# No uid fields here either, for the same reason as the Prometheus datasource: Grafana 13
# refuses to provision a datasource that declares one, and the failure is fatal.
datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
