server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (react-router-dom, TASK-034's app shell): any path that isn't a real static
    # asset falls back to index.html so the SPA's own router - not nginx - decides what to render.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
