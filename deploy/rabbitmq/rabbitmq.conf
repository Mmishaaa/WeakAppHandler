# Skeleton RabbitMQ configuration for the base docker-compose stack (TASK-006).
# Loads deploy/rabbitmq/definitions.json (currently just the default "/" vhost) at boot,
# so later tasks can grow that file into the real topology without touching this config:
# TASK-012 (readings.exchange, readings.ingested/readings.attempt routing keys, DLQ) and
# TASK-043 (least-privilege per-service users, removal of the "guest" user).
management.load_definitions = /etc/rabbitmq/definitions.json
