# Loads deploy/rabbitmq/definitions.json at boot, so later tasks can grow that file into the real
# topology without touching this config: TASK-012 (readings.exchange, readings.ingested/attempt/
# stored routing keys, DLQ) and TASK-043 (least-privilege per-service users, removal of "guest").
#
# TASK-043's permission model, in one place since definitions.json is plain JSON and can't carry
# comments: every service (Ingestor/Processor/Notification/Gateway) shares `configure`+`write` on
# `readings.exchange` only, because every one of them calls `ConfigureReadingsTopology()`
# (src/ServiceDefaults/.../Messaging/ReadingsTopologyExtensions.cs), which declares Publish<T>
# topology for all three ingestion message types on every bus regardless of whether that service
# ever calls Publish -- and a consumer's own queue.bind against the exchange independently needs
# `write` on the exchange being bound to, on top of `configure` on its own queue. Each service's
# `read`/`configure` beyond that is scoped to only the queue(s) it actually owns (plus that queue's
# own "_error" dead-letter sibling, which the owning consumer's retry policy declares lazily, not at
# startup): Ingestor owns no queue at all (publish-only); Processor owns readings.ingested/attempt;
# Notification owns readings.stored; Gateway owns readings.stored.gateway. No service can read,
# configure, or bind another service's queue. The `admin` user is a human/ops account for the
# management UI (port 15672) -- distinct from any service credential -- since removing `guest`
# would otherwise leave nobody able to log in at all.
management.load_definitions = /etc/rabbitmq/definitions.json
