name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy. Defaults to the commit sha.'
        required: false
        type: string

permissions:
  contents: read

# One deploy at a time, and a deploy that has started is allowed to finish or roll back.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # The runner is the target host here: there is no remote environment to ship to, so the
      # pipeline proves the deploy by running it end to end and tearing it down afterwards.
      # deploy.ps1 validates the compose file, creates the secrets and smoke-tests every
      # endpoint, so a broken docker-compose.yml fails here before anything is built.
      - name: Deploy
        shell: pwsh
        run: ./scripts/deploy.ps1 -Tag "${{ inputs.tag || github.sha }}"
        # init-secrets.ps1 writes these into secrets/. A repository secret that does not exist
        # expands to an empty string, and the script then falls back to the development value.
        env:
          WEAKAPPHANDLER_SECRET_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          WEAKAPPHANDLER_SECRET_GATEWAY_DB_PASSWORD: ${{ secrets.GATEWAY_DB_PASSWORD }}
          WEAKAPPHANDLER_SECRET_RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          WEAKAPPHANDLER_SECRET_WEAKAPP_API_KEY: ${{ secrets.WEAKAPP_API_KEY }}
          WEAKAPPHANDLER_SECRET_PGADMIN_PASSWORD: ${{ secrets.PGADMIN_PASSWORD }}
          WEAKAPPHANDLER_SECRET_GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}

      # Both profiles, so the logs and the teardown also reach services the deploy did not start.
      - name: Collect the logs of whatever failed
        if: failure()
        run: docker compose --profile observability --profile tools logs --tail=100

      - name: Tear the stack down
        if: always()
        run: docker compose --profile observability --profile tools down -v --remove-orphans
