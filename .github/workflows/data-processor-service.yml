name: Data Processor Service

on:
  push:
    branches: [main, dev]
    paths:
      - 'Source/DataProcessorService/**'
      - 'Source/Shared/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.editorconfig'
      - 'stylecop.json'
      - 'nuget.config'
      - '.github/workflows/data-processor-service.yml'
  pull_request:
    paths:
      - 'Source/DataProcessorService/**'
      - 'Source/Shared/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.editorconfig'
      - 'stylecop.json'
      - 'nuget.config'
      - '.github/workflows/data-processor-service.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the running build pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION: Source/DataProcessorService/DataProcessorService.slnx
  DOCKERFILE: Source/DataProcessorService/DataProcessorService.API/Dockerfile
  IMAGE: weakapphandler/data-processor-service

jobs:
  build:
    name: Build, lint, test and package
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level ones, so contents is repeated here.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Central Package Management keeps every version in one file, so hashing it
      # is enough to know whether the restored graph can change.
      - name: Restore the NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore $SOLUTION

      # Formatting and code style. Analyzer violations fail the build step below
      # on their own, because the repository builds with TreatWarningsAsErrors.
      - name: Lint
        run: dotnet format $SOLUTION --verify-no-changes --no-restore

      - name: Build
        run: dotnet build $SOLUTION --configuration Release --no-restore

      # Unit tests run in process; the integration tests start a throwaway
      # PostgreSQL container through Testcontainers on the runner's Docker daemon.
      - name: Test
        run: >-
          dotnet test $SOLUTION
          --configuration Release
          --no-build
          --logger "trx;LogFileName=data-processor-service.trx"
          --results-directory artifacts/test-results

      - name: Publish the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-processor-service-test-results
          path: artifacts/test-results
          if-no-files-found: ignore

      # The build context is the repository root: the image needs Directory.*.props
      # and the Shared project. The source label links the package to this repository,
      # so it inherits the repository's visibility and access.
      - name: Build the Docker image
        run: >-
          docker build
          --file $DOCKERFILE
          --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          --tag $IMAGE:${{ github.sha }}
          .

      # Pull requests only prove that the image builds: a token from a fork cannot write
      # packages, and an image nobody has merged has nowhere to go.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR accepts lowercase names only, and the owner may not be. latest follows main
      # alone, so it always points at what was merged there; every push keeps its sha tag.
      - name: Push the Docker image
        if: github.event_name != 'pull_request'
        run: |
          remote="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE"
          tags=("$GITHUB_SHA")
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then tags+=(latest); fi

          for tag in "${tags[@]}"; do
            docker tag "$IMAGE:$GITHUB_SHA" "$remote:$tag"
            docker push "$remote:$tag"
          done
