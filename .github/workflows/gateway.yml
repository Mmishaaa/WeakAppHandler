name: Gateway CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/Gateway/**'
      - 'tests/WeakAppHandler.Gateway.Api.Tests/**'
      - 'src/Processor/WeakAppHandler.Processor.Domain/**'
      - 'src/Processor/WeakAppHandler.Processor.Application/**'
      - 'src/Processor/WeakAppHandler.Processor.Infrastructure/**'
      - 'src/ServiceDefaults/**'
      - 'src/SharedKernel/**'
      - 'src/Contracts/**'
      - 'tests/Shared/WeakAppHandler.IntegrationTesting/**'
      - 'gateway.slnf'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.editorconfig'
      - 'stylecop.json'
      - '.github/workflows/gateway.yml'
  push:
    branches: [main]
    paths:
      - 'src/Gateway/**'
      - 'tests/WeakAppHandler.Gateway.Api.Tests/**'
      - 'src/Processor/WeakAppHandler.Processor.Domain/**'
      - 'src/Processor/WeakAppHandler.Processor.Application/**'
      - 'src/Processor/WeakAppHandler.Processor.Infrastructure/**'
      - 'src/ServiceDefaults/**'
      - 'src/SharedKernel/**'
      - 'src/Contracts/**'
      - 'tests/Shared/WeakAppHandler.IntegrationTesting/**'
      - 'gateway.slnf'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.editorconfig'
      - 'stylecop.json'
      - '.github/workflows/gateway.yml'

concurrency:
  group: gateway-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test, and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore gateway.slnf

      # Directory.Build.props sets TreatWarningsAsErrors + StyleCop/.NET analyzers globally, so this
      # build step is also the lint/static-analysis gate - a warning here fails the workflow.
      - name: Build (warnings as errors)
        run: dotnet build gateway.slnf --configuration Release --no-restore

      - name: Test
        run: dotnet test gateway.slnf --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Build Docker image
        run: docker build -f src/Gateway/WeakAppHandler.Gateway.Api/Dockerfile -t weakapphandler-gateway:ci .
