name: Gateway CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: gateway-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test, and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # See auth.yml for why this is a job-level path filter (job always runs, steps are gated on
      # its output) rather than a paths: filter on the trigger itself: a required status check tied
      # to a path-filtered trigger never gets reported for a PR that doesn't touch those paths,
      # which leaves branch protection waiting forever on a check that will never arrive.
      #
      # Includes src/Auth/** - GatewayApiFactory.cs (Gateway.Api.Tests) references
      # AuthApi::WeakAppHandler.Auth.* directly and boots a real in-process Auth host for its own
      # authorization tests, so a regression in Auth's code can break this suite too.
      - name: Check relevant paths changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'src/Gateway/**'
              - 'tests/WeakAppHandler.Gateway.Api.Tests/**'
              - 'src/Auth/**'
              - 'src/Processor/WeakAppHandler.Processor.Domain/**'
              - 'src/Processor/WeakAppHandler.Processor.Application/**'
              - 'src/Processor/WeakAppHandler.Processor.Infrastructure/**'
              - 'src/ServiceDefaults/**'
              - 'src/SharedKernel/**'
              - 'src/Contracts/**'
              - 'tests/Shared/WeakAppHandler.IntegrationTesting/**'
              - 'gateway.slnf'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - '.editorconfig'
              - 'stylecop.json'
              - '.github/workflows/gateway.yml'

      - name: Setup .NET
        if: steps.filter.outputs.relevant == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        if: steps.filter.outputs.relevant == 'true'
        run: dotnet restore gateway.slnf

      # Directory.Build.props sets TreatWarningsAsErrors + StyleCop/.NET analyzers globally, so this
      # build step is also the lint/static-analysis gate - a warning here fails the workflow.
      - name: Build (warnings as errors)
        if: steps.filter.outputs.relevant == 'true'
        run: dotnet build gateway.slnf --configuration Release --no-restore

      - name: Test
        if: steps.filter.outputs.relevant == 'true'
        run: dotnet test gateway.slnf --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Build Docker image
        if: steps.filter.outputs.relevant == 'true'
        run: docker build -f src/Gateway/WeakAppHandler.Gateway.Api/Dockerfile -t weakapphandler-gateway:ci .
