name: Frontend

on:
  push:
    branches: [main, dev]
    paths:
      - 'Source/Frontend/**'
      - 'Source/GraphQlGateway/schema.graphql'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'Source/Frontend/**'
      - 'Source/GraphQlGateway/schema.graphql'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the running build pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Source/Frontend

jobs:
  build:
    name: Build, lint, test and package
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level ones, so contents is repeated here.
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: weakapphandler/frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # The Yarn release is pinned by packageManager in package.json; Corepack
      # installs exactly that one instead of whatever ships with the runner.
      - name: Enable Corepack
        run: corepack enable
        working-directory: .

      # Yarn 4 keeps its archives in a global cache outside the project, so ask it where.
      - name: Locate the Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Restore the Yarn cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.yarn-cache.outputs.dir }}
            Source/Frontend/.yarn/install-state.gz
          key: yarn-${{ runner.os }}-${{ hashFiles('Source/Frontend/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      # --immutable fails instead of rewriting the lockfile, so CI can never
      # silently resolve a different dependency graph than the one committed.
      - name: Install the dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Type-check and build
        run: yarn build

      - name: Test
        run: yarn test

      # The committed GraphQL types must match the gateway schema; regenerating
      # them here turns a stale schema into a failed build rather than a runtime error.
      - name: Verify the generated GraphQL types are current
        run: |
          yarn codegen
          git diff --exit-code -- src/gql

      # Runs against `vite preview` of the build above, with the GraphQL, REST and SignalR
      # endpoints stubbed in the browser, so no backend has to be started.
      - name: Install the Playwright browser
        run: yarn playwright install --with-deps chromium

      - name: End-to-end tests
        run: yarn e2e

      - name: Publish the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: Source/Frontend/playwright-report
          if-no-files-found: ignore

      # The source label links the package to this repository, so it inherits the
      # repository's visibility and access.
      - name: Build the Docker image
        run: >-
          docker build
          --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          --tag $IMAGE:${{ github.sha }}
          Source/Frontend
        working-directory: .

      # <commit time in UTC>-<branch>, e.g. 2026-09-25-13.12-update-metrics-format. The time is
      # the commit's, not the clock's, so every workflow one push starts tags its image alike and
      # a set of images from one commit can be deployed together. The branch is lowercased and
      # reduced to the characters a Docker tag allows.
      - name: Compute the image tag
        id: tag
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          stamp=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%d-%H.%M)
          branch=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^[.-]+//; s/-+$//')
          echo "value=$(printf '%s-%s' "$stamp" "$branch" | cut -c1-128)" >> "$GITHUB_OUTPUT"

      # Pull requests only prove that the image builds: a token from a fork cannot write
      # packages, and an image nobody has merged has nowhere to go.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR accepts lowercase names only, and the owner may not be. Every push gets the dated
      # branch tag and the commit sha; latest follows main alone, so it always points at what
      # was merged there. The job summary names the tag deploy.yml takes as input.
      - name: Push the Docker image
        if: github.event_name != 'pull_request'
        env:
          DATED_TAG: ${{ steps.tag.outputs.value }}
        run: |
          remote="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE"
          tags=("$DATED_TAG" "$GITHUB_SHA")
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then tags+=(latest); fi

          for tag in "${tags[@]}"; do
            docker tag "$IMAGE:$GITHUB_SHA" "$remote:$tag"
            docker push "$remote:$tag"
          done

          {
            echo "### $IMAGE"
            for tag in "${tags[@]}"; do echo "- \`$remote:$tag\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

# ci-check: touches every pipeline so a pull request runs them all. Do not merge.
