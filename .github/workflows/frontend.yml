name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'src/Gateway/WeakAppHandler.Gateway.Api/schema.graphql'
      - '.github/workflows/frontend.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'src/Gateway/WeakAppHandler.Gateway.Api/schema.graphql'
      - '.github/workflows/frontend.yml'

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint, typecheck, build, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Runs codegen (prebuild) against the committed schema.graphql, then tsc -b + vite build.
      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm test

      # TASK-050 introduces the actual Playwright suite; this step activates itself once that
      # config/script exists, so this workflow won't need editing again to pick it up.
      - name: End-to-end tests (Playwright, if configured)
        run: |
          if [ -f "playwright.config.ts" ] || [ -f "playwright.config.js" ]; then
            npx playwright install --with-deps
            npm run test:e2e --if-present
          else
            echo "No Playwright config present yet (see TASK-050) - skipping e2e tests."
          fi
