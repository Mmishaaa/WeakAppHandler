name: Frontend

on:
  push:
    branches: [main, dev]
    paths:
      - 'Source/Frontend/**'
      - 'Source/GraphQlGateway/schema.graphql'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'Source/Frontend/**'
      - 'Source/GraphQlGateway/schema.graphql'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the running build pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Source/Frontend

jobs:
  build:
    name: Build, lint, test and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # The Yarn release is pinned by packageManager in package.json; Corepack
      # installs exactly that one instead of whatever ships with the runner.
      - name: Enable Corepack
        run: corepack enable
        working-directory: .

      # Yarn 4 keeps its archives in a global cache outside the project, so ask it where.
      - name: Locate the Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Restore the Yarn cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.yarn-cache.outputs.dir }}
            Source/Frontend/.yarn/install-state.gz
          key: yarn-${{ runner.os }}-${{ hashFiles('Source/Frontend/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      # --immutable fails instead of rewriting the lockfile, so CI can never
      # silently resolve a different dependency graph than the one committed.
      - name: Install the dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Type-check and build
        run: yarn build

      - name: Test
        run: yarn test

      # The committed GraphQL types must match the gateway schema; regenerating
      # them here turns a stale schema into a failed build rather than a runtime error.
      - name: Verify the generated GraphQL types are current
        run: |
          yarn codegen
          git diff --exit-code -- src/gql

      # Runs against `vite preview` of the build above, with the GraphQL, REST and SignalR
      # endpoints stubbed in the browser, so no backend has to be started.
      - name: Install the Playwright browser
        run: yarn playwright install --with-deps chromium

      - name: End-to-end tests
        run: yarn e2e

      - name: Publish the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: Source/Frontend/playwright-report
          if-no-files-found: ignore

      - name: Build the Docker image
        run: docker build --tag weakapphandler/frontend:${{ github.sha }} Source/Frontend
        working-directory: .
