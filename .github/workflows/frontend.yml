name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint, typecheck, build, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # See the backend workflows (e.g. auth.yml) for why this is a job-level path filter (job
      # always runs, steps are gated on its output) rather than a paths: filter on the trigger
      # itself: a required status check tied to a path-filtered trigger never gets reported for a
      # PR that doesn't touch these paths, which leaves branch protection waiting forever on a
      # check that will never arrive.
      - name: Check relevant paths changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'frontend/**'
              - 'src/Gateway/WeakAppHandler.Gateway.Api/schema.graphql'
              - '.github/workflows/frontend.yml'

      - name: Setup Node
        if: steps.filter.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.filter.outputs.relevant == 'true'
        run: npm ci

      - name: Lint
        if: steps.filter.outputs.relevant == 'true'
        run: npm run lint

      # Runs codegen (prebuild) against the committed schema.graphql, then tsc -b + vite build.
      - name: Typecheck and build
        if: steps.filter.outputs.relevant == 'true'
        run: npm run build

      - name: Unit tests
        if: steps.filter.outputs.relevant == 'true'
        run: npm test

      # TASK-050's Playwright suite (S1-S7) needs the full docker-compose stack (11 services) up
      # and healthy, not just this job's Node checkout - genuinely running it here would mean
      # standing up every backend service in CI too, well beyond this workflow's own scope. Gated
      # on E2E_FRONTEND_URL (a repo/environment variable, unset by default) rather than just the
      # config file existing, so this stays a deliberate opt-in for whoever wires a real
      # compose-based E2E workflow later, instead of silently failing every PR the moment
      # playwright.config.ts exists. Run it locally with `npm run test:e2e --prefix frontend`
      # against a stack already up via `docker compose up` (see the root README's demo scenarios).
      - name: End-to-end tests (Playwright, opt-in via E2E_FRONTEND_URL)
        if: steps.filter.outputs.relevant == 'true' && vars.E2E_FRONTEND_URL != ''
        env:
          E2E_FRONTEND_URL: ${{ vars.E2E_FRONTEND_URL }}
        run: |
          npx playwright install --with-deps
          npm run test:e2e --if-present
