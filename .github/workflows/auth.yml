name: Auth CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: auth-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test, and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A required status check tied to a path-filtered *trigger* never gets reported at all for a
      # PR that doesn't touch these paths, which leaves GitHub's branch protection waiting forever
      # on a check that will never arrive (found the hard way: PR #52 got stuck "pending"
      # indefinitely despite every check that DID run passing). Triggering the job unconditionally
      # and instead gating its steps on this filter keeps path-scoping while still always reporting
      # a result.
      - name: Check relevant paths changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'src/Auth/**'
              - 'tests/WeakAppHandler.Auth.Tests/**'
              - 'src/ServiceDefaults/**'
              - 'src/SharedKernel/**'
              - 'src/Contracts/**'
              - 'auth.slnf'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - '.editorconfig'
              - 'stylecop.json'
              - '.github/workflows/auth.yml'

      - name: Setup .NET
        if: steps.filter.outputs.relevant == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        if: steps.filter.outputs.relevant == 'true'
        run: dotnet restore auth.slnf

      # Directory.Build.props sets TreatWarningsAsErrors + StyleCop/.NET analyzers globally, so this
      # build step is also the lint/static-analysis gate - a warning here fails the workflow.
      - name: Build (warnings as errors)
        if: steps.filter.outputs.relevant == 'true'
        run: dotnet build auth.slnf --configuration Release --no-restore

      - name: Test
        if: steps.filter.outputs.relevant == 'true'
        run: dotnet test auth.slnf --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Build Docker image
        if: steps.filter.outputs.relevant == 'true'
        run: docker build -f src/Auth/WeakAppHandler.Auth/Dockerfile -t weakapphandler-auth:ci .
