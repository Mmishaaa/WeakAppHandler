<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 300" width="1240" height="300" role="img" aria-label="A push runs the service pipelines, which publish images to GHCR under a dated branch tag, the commit sha and latest on main; deploy.yml takes a tag per service, and deploy.ps1 pulls those images, starts the stack, smoke-tests it and rolls back on failure." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  svg { color: #1a2230; }
  .bg { fill: #ffffff; }
  .box { fill: #ffffff; stroke: #c7cfdb; stroke-width: 1.5; }
  .box-ext { fill: #f4f6f9; stroke: #c7cfdb; stroke-width: 1.5; stroke-dasharray: 5 4; }
  .box-bus { fill: #e3f3f4; stroke: #0b7a85; stroke-width: 1.5; }
  .zone { fill: #eaeef4; }
  text { font-family: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; }
  .t-title { font-size: 14px; font-weight: 600; fill: #1a2230; }
  .t-sub { font-size: 11.5px; fill: #5a6577; }
  .t-edge, .t-msg, .t-zone { font-family: "IBM Plex Mono", Consolas, Menlo, monospace; font-size: 11px; }
  .t-edge { fill: #5a6577; }
  .t-msg { fill: #0b7a85; }
  .t-zone { font-size: 10.5px; letter-spacing: 0.08em; fill: #5a6577; }
  .e-sync { stroke: #1a2230; stroke-width: 1.4; fill: none; }
  .e-msg { stroke: #0b7a85; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
  .head-sync { fill: #1a2230; }
  .head-msg { fill: #0b7a85; }
  @media (prefers-color-scheme: dark) {
    .bg, .box { fill: #171e28; }
    .box { stroke: #334052; }
    .box-ext { fill: #0f141b; stroke: #334052; }
    .box-bus { fill: #123238; stroke: #3cc4cf; }
    .zone { fill: #131a23; }
    .t-title { fill: #e5eaf1; }
    .t-sub, .t-edge, .t-zone { fill: #9aa6b8; }
    .t-msg { fill: #3cc4cf; }
    .e-sync { stroke: #e5eaf1; }
    .e-msg { stroke: #3cc4cf; }
    .head-sync { fill: #e5eaf1; }
    .head-msg { fill: #3cc4cf; }
  }
</style>
  <title>A push runs the service pipelines, which publish images to GHCR under a dated branch tag, the commit sha and latest on main; deploy.yml takes a tag per service, and deploy.ps1 pulls those images, starts the stack, smoke-tests it and rolls back on failure.</title>
  <rect class="bg" x="0" y="0" width="1240" height="300" rx="12"/>
          <defs>
            <marker id="head-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
              <path d="M0,0 L10,5 L0,10 z" class="head-sync"/>
            </marker>
          </defs>

          <rect class="box-ext" x="20" y="60" width="170" height="92" rx="8"/>
          <text class="t-title" x="105" y="92" text-anchor="middle">git push</text>
          <text class="t-sub" x="105" y="112" text-anchor="middle">dev or main</text>
          <text class="t-sub" x="105" y="128" text-anchor="middle">paths pick pipelines</text>

          <rect class="box" x="270" y="60" width="190" height="92" rx="8"/>
          <text class="t-title" x="365" y="92" text-anchor="middle">Service CI × 5</text>
          <text class="t-sub" x="365" y="112" text-anchor="middle">lint · build · test</text>
          <text class="t-sub" x="365" y="128" text-anchor="middle">docker build</text>

          <rect class="box" x="540" y="60" width="190" height="92" rx="8"/>
          <text class="t-title" x="635" y="92" text-anchor="middle">GHCR</text>
          <text class="t-sub" x="635" y="112" text-anchor="middle">2026-09-27-14.40-dev</text>
          <text class="t-sub" x="635" y="128" text-anchor="middle">sha · latest (main)</text>

          <rect class="box" x="810" y="60" width="190" height="92" rx="8"/>
          <text class="t-title" x="905" y="92" text-anchor="middle">deploy.yml</text>
          <text class="t-sub" x="905" y="112" text-anchor="middle">Run workflow:</text>
          <text class="t-sub" x="905" y="128" text-anchor="middle">a tag per service</text>

          <rect class="box" x="1060" y="40" width="160" height="132" rx="8"/>
          <text class="t-title" x="1140" y="66" text-anchor="middle">deploy.ps1</text>
          <text class="t-sub" x="1140" y="86" text-anchor="middle">secrets, compose config</text>
          <text class="t-sub" x="1140" y="102" text-anchor="middle">pull images</text>
          <text class="t-sub" x="1140" y="118" text-anchor="middle">up --wait</text>
          <text class="t-sub" x="1140" y="134" text-anchor="middle">smoke-test 10 endpoints</text>
          <text class="t-sub" x="1140" y="150" text-anchor="middle">record the release</text>

          <line class="e-sync" x1="190" y1="106" x2="268" y2="106" marker-end="url(#head-d)"/>
          <line class="e-sync" x1="460" y1="106" x2="538" y2="106" marker-end="url(#head-d)"/>
          <text class="t-edge" x="499" y="98" text-anchor="middle">push</text>
          <line class="e-sync" x1="730" y1="106" x2="808" y2="106" marker-end="url(#head-d)"/>
          <text class="t-edge" x="769" y="98" text-anchor="middle">tags</text>
          <line class="e-sync" x1="1000" y1="106" x2="1058" y2="106" marker-end="url(#head-d)"/>

          <!-- pull request branch -->
          <polyline class="e-sync" points="365,152 365,222" marker-end="url(#head-d)"/>
          <rect class="box-ext" x="270" y="224" width="190" height="56" rx="8"/>
          <text class="t-title" x="365" y="248" text-anchor="middle">pull request</text>
          <text class="t-sub" x="365" y="266" text-anchor="middle">build only, nothing pushed</text>

          <!-- tag push branch -->
          <rect class="box-ext" x="810" y="224" width="190" height="56" rx="8"/>
          <text class="t-title" x="905" y="248" text-anchor="middle">v* tag</text>
          <text class="t-sub" x="905" y="266" text-anchor="middle">builds from source instead</text>
          <line class="e-sync" x1="905" y1="222" x2="905" y2="154" marker-end="url(#head-d)"/>

          <!-- rollback -->
          <line class="e-sync" x1="1140" y1="172" x2="1140" y2="222" marker-end="url(#head-d)"/>
          <text class="t-edge" x="1132" y="202" text-anchor="end">on failure</text>
          <rect class="box-ext" x="1060" y="224" width="160" height="56" rx="8"/>
          <text class="t-title" x="1140" y="248" text-anchor="middle">rollback</text>
          <text class="t-sub" x="1140" y="266" text-anchor="middle">previous release back up</text>
        
</svg>
