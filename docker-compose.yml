services:
  weakapp:
    build:
      context: ./third_party/weak-app
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "${WEAKAPP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    networks:
      - backend
    ports:
      # 5672 is AMQP for the services, 15672 the management UI for us.
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      # Named volume, so queues and their contents survive `docker compose down` without -v.
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
      # The broker takes a while to come up; without this the first probes would burn the retries.
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weakapphandler}
      POSTGRES_USER: ${POSTGRES_USER:-processor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-processor_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -U and -d are not optional here: without them pg_isready checks the "postgres" database as
      # the "root" user and reports ready before ours exists.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-processor} -d ${POSTGRES_DB:-weakapphandler}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres-data:
  rabbitmq-data:

networks:
  backend:
