name: weakapphandler

# Defaults live here and only here: every value can be overridden from .env, and .env.example
# lists what is worth overriding. Passwords are not environment variables at all; they are
# files under secrets/, created by scripts/init-secrets.ps1 and mounted below.
#
# Our five images are named ${IMAGE_REGISTRY}/<service>:<tag>. Locally the registry is just the
# "weakapphandler" prefix and compose builds the images; scripts/deploy.ps1 -Registry points it
# at GHCR and pulls what CI published. Each service takes its own <SERVICE>_TAG, falling back to
# IMAGE_TAG and then to latest, because a push only rebuilds the services it touched.
#
# This file describes the stack the way it is deployed: Production, observability behind the
# "observability" profile, pgAdmin behind "tools". docker-compose.override.yml, which compose
# loads on its own, switches the services to Development for local work.

x-dotnet-environment: &dotnet-environment
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
  Telemetry__OtlpEndpoint: http://tempo:4317
  Serilog__WriteTo__Loki__Args__uri: http://loki:3100

x-rabbitmq-environment: &rabbitmq-environment
  RabbitMq__Host: rabbitmq
  RabbitMq__Username: ${RABBITMQ_USER:-guest}

# The runtime image has bash but no curl, so the probe speaks just enough HTTP by hand.
x-dotnet-healthcheck: &dotnet-healthcheck
  test:
    - CMD
    - bash
    - -c
    - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 30s

services:
  weakapp:
    build:
      context: ./third_party/weak-app
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "127.0.0.1:${WEAKAPP_PORT:-8080}:8080"
    environment:
      # The vendored API is a stand-in for a third party, so it keeps its own environment.
      ASPNETCORE_ENVIRONMENT: ${WEAKAPP_ENVIRONMENT:-Development}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    networks:
      - backend
    ports:
      # 5672 is AMQP for the services, 15672 the management UI for us.
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
    secrets:
      - rabbitmq_password
    # The image reads the default password from the environment only, so it is exported from
    # the secret right before the broker starts instead of living in the container definition.
    entrypoint:
      - /bin/sh
      - -c
      - export RABBITMQ_DEFAULT_PASS="$$(cat /run/secrets/rabbitmq_password)"; exec docker-entrypoint.sh rabbitmq-server
    volumes:
      # Named volume, so queues and their contents survive `docker compose down` without -v.
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      # Every probe boots its own Erlang VM for the CLI; on a busy host (a cold `up --build`
      # starting the whole stack) that alone can take several seconds.
      timeout: 15s
      retries: 10
      # The broker takes a while to come up; without this the first probes would burn the retries.
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weakapphandler}
      POSTGRES_USER: ${POSTGRES_USER:-processor}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Consumed by the init script, not by the image itself.
      GATEWAY_DB_USER: ${GATEWAY_DB_USER:-gateway}
    secrets:
      - postgres_password
      - gateway_db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Scripts here run once, and only while the data directory is still empty.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -U and -d are not optional here: without them pg_isready checks the "postgres" database as
      # the "root" user and reports ready before ours exists.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-processor} -d ${POSTGRES_DB:-weakapphandler}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  pgadmin:
    image: dpage/pgadmin4:9.17
    profiles: [tools]
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    environment:
      # pgAdmin validates this address and rejects reserved TLDs such as .local.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@weakapphandler.com}
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password
      # Local tool, one user: skip the extra master-password prompt.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    secrets:
      - pgadmin_password
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      # Pre-registers the connections. Imported once, on an empty pgadmin volume.
      - ./db/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  ingestor:
    image: ${IMAGE_REGISTRY:-weakapphandler}/data-ingestor-service:${INGESTOR_TAG:-${IMAGE_TAG:-latest}}
    build:
      # Root context: the build needs Directory.*.props and the Shared project.
      context: .
      dockerfile: Source/DataIngestorService/DataIngestorService/Dockerfile
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "127.0.0.1:${INGESTOR_PORT:-5227}:8080"
    environment:
      <<: [*dotnet-environment, *rabbitmq-environment]
      WeakApp__BaseUrl: http://weakapp:8080
    secrets:
      # Mounted under configuration key names, which AddDockerSecrets reads back.
      - source: rabbitmq_password
        target: RabbitMq__Password
      - source: weakapp_api_key
        target: WeakApp__ApiKey
    healthcheck: *dotnet-healthcheck
    depends_on:
      weakapp:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  processor:
    image: ${IMAGE_REGISTRY:-weakapphandler}/data-processor-service:${PROCESSOR_TAG:-${IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: Source/DataProcessorService/DataProcessorService.API/Dockerfile
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "127.0.0.1:${PROCESSOR_PORT:-5242}:8080"
    environment:
      <<: [*dotnet-environment, *rabbitmq-environment]
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-weakapphandler};Username=${POSTGRES_USER:-processor}
    secrets:
      - source: postgres_password
        target: Database__Password
      - source: rabbitmq_password
        target: RabbitMq__Password
    # /health answers only after the migrations have run, so healthy also means "schema exists".
    healthcheck:
      <<: *dotnet-healthcheck
      start_period: 60s
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  notifications:
    image: ${IMAGE_REGISTRY:-weakapphandler}/notification-service:${NOTIFICATIONS_TAG:-${IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: Source/NotificationService/NotificationService.API/Dockerfile
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "127.0.0.1:${NOTIFICATIONS_PORT:-5244}:8080"
    environment:
      <<: [*dotnet-environment, *rabbitmq-environment]
      # The browser origin the Vite dev server runs on; the container reaches the hub through nginx.
      ClientApp__AllowedOrigins__0: ${CLIENT_APP_ORIGIN:-http://localhost:5173}
    secrets:
      - source: rabbitmq_password
        target: RabbitMq__Password
    healthcheck: *dotnet-healthcheck
    depends_on:
      rabbitmq:
        condition: service_healthy

  gateway:
    image: ${IMAGE_REGISTRY:-weakapphandler}/graphql-gateway:${GATEWAY_TAG:-${IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: Source/GraphQlGateway/GraphQlGateway.API/Dockerfile
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-5243}:8080"
    environment:
      <<: *dotnet-environment
      # Read-only role; the schema belongs to the processor.
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-weakapphandler};Username=${GATEWAY_DB_USER:-gateway}
    secrets:
      - source: gateway_db_password
        target: Database__Password
    healthcheck: *dotnet-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      # The gateway has nothing to serve until the processor has created the schema.
      processor:
        condition: service_healthy

  frontend:
    image: ${IMAGE_REGISTRY:-weakapphandler}/frontend:${FRONTEND_TAG:-${IMAGE_TAG:-latest}}
    build:
      # Self-contained context: the app needs nothing from the rest of the repository.
      context: ./Source/Frontend
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5180}:80"
    environment:
      # nginx proxies these under the page's own origin, so the browser never sees CORS.
      GATEWAY_URL: http://gateway:8080
      PROCESSOR_URL: http://processor:8080
      NOTIFICATIONS_URL: http://notifications:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      gateway:
        condition: service_healthy
      processor:
        condition: service_healthy
      notifications:
        condition: service_healthy

  loki:
    image: grafana/loki:3.6.5
    profiles: [observability]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    networks:
      - backend
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:3.0.3
    profiles: [observability]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    networks:
      - backend
    ports:
      # 4317 is OTLP over gRPC, what the services push to; 3200 is Tempo's own API.
      - "127.0.0.1:${TEMPO_OTLP_PORT:-4317}:4317"
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  # No depends_on on the services: Prometheus keeps scraping targets that are not up yet.
  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: [observability]
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.1.3
    profiles: [observability]
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      # Local tool behind compose: skip the sign-in wall so the dashboard opens on click.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    secrets:
      - grafana_password
    volumes:
      - grafana-data:/var/lib/grafana
      # Mounted one directory deep on purpose: replacing the whole provisioning folder
      # hides the image's own plugins/, alerting/ and notifiers/ subdirectories, and
      # Grafana treats those as missing rather than empty.
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started

# Files under secrets/ are git-ignored and created by scripts/init-secrets.ps1.
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  gateway_db_password:
    file: ./secrets/gateway_db_password
  rabbitmq_password:
    file: ./secrets/rabbitmq_password
  weakapp_api_key:
    file: ./secrets/weakapp_api_key
  pgadmin_password:
    file: ./secrets/pgadmin_password
  grafana_password:
    file: ./secrets/grafana_password

volumes:
  postgres-data:
  rabbitmq-data:
  pgadmin-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:

networks:
  backend:
