services:
  weakapp:
    build:
      context: ./third_party/weak-app
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "${WEAKAPP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  backend:
