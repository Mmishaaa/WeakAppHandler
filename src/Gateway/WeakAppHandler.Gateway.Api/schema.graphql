schema {
  query: Query
  subscription: Subscription
}

type Query @authorize(policy: "ViewerPolicy") {
  meters(
    where: MeterReadModelFilterInput @cost(weight: "10")
    order: [MeterReadModelSortInput!] @cost(weight: "10")
  ): [MeterReadModel!]! @cost(weight: "10")
  readings(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: ReadingReadModelFilterInput @cost(weight: "10")
    order: [ReadingReadModelSortInput!] @cost(weight: "10")
  ): ReadingsConnection
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  alerts(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: AlertReadModelFilterInput @cost(weight: "10")
    order: [AlertReadModelSortInput!] @cost(weight: "10")
  ): AlertsConnection
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  alertRules(
    where: AlertRuleReadModelFilterInput @cost(weight: "10")
    order: [AlertRuleReadModelSortInput!] @cost(weight: "10")
  ): [AlertRuleReadModel!]! @cost(weight: "10")
  aggregations(
    metricCode: String!
    bucket: AggregationBucketSize!
    from: DateTime!
    to: DateTime!
    location: String
    meterType: String
  ): [AggregationBucketReadModel!]! @cost(weight: "10")
}

type Subscription @authorize(policy: "ViewerPolicy") {
  onReadingStored(location: String, meterType: String): ReadingStoredPayload!
}

type AggregationBucketReadModel {
  bucketStart: DateTime!
  location: String!
  meterType: String!
  avg: Decimal
  min: Decimal
  max: Decimal
  sum: Decimal
  count: Int!
}

type AlertReadModel {
  id: UUID!
  ruleId: UUID!
  meterId: UUID!
  location: String!
  meterType: String!
  metricCode: String!
  status: AlertStatus!
  severity: AlertSeverity!
  triggeredAt: DateTime!
  triggeredValueNumeric: Decimal
  triggeredValueBool: Boolean
  resolvedAt: DateTime
  resolvedValueNumeric: Decimal
  resolvedValueBool: Boolean
}

type AlertRuleReadModel {
  id: UUID!
  name: String!
  location: String
  meterType: String
  metricCode: String!
  operator: AlertOperator!
  thresholdNumeric: Decimal
  thresholdBool: Boolean
  severity: AlertSeverity!
  hysteresisPercent: Decimal!
  cooldownSeconds: Int!
  isEnabled: Boolean!
  lastTriggeredAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

"A connection to a list of items."
type AlertsConnection {
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "A list of edges."
  edges: [AlertsEdge!]
  "A flattened list of the nodes."
  nodes: [AlertReadModel!]
}

"An edge in a connection."
type AlertsEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: AlertReadModel!
}

type MeterCurrentValueReadModel {
  meterId: UUID!
  metricCode: String!
  valueNumeric: Decimal
  valueBool: Boolean
  previousValueNumeric: Decimal
  previousValueBool: Boolean
  observedAt: DateTime!
  changedAt: DateTime!
}

type MeterReadModel {
  id: UUID!
  location: String!
  meterType: String!
  firstSeenAt: DateTime!
  lastSeenAt: DateTime!
  currentValues: [MeterCurrentValueReadModel!]! @cost(weight: "10")
}

"Information about pagination in a connection."
type PageInfo {
  "Indicates whether more edges exist following the set defined by the clients arguments."
  hasNextPage: Boolean!
  "Indicates whether more edges exist prior the set defined by the clients arguments."
  hasPreviousPage: Boolean!
  "When paginating backwards, the cursor to continue."
  startCursor: String
  "When paginating forwards, the cursor to continue."
  endCursor: String
}

type ReadingReadModel {
  id: Long!
  meterId: UUID!
  location: String!
  meterType: String!
  metricCode: String!
  observedAt: DateTime!
  valueNumeric: Decimal
  valueBool: Boolean
  isChanged: Boolean!
}

"A connection to a list of items."
type ReadingsConnection {
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "A list of edges."
  edges: [ReadingsEdge!]
  "A flattened list of the nodes."
  nodes: [ReadingReadModel!]
}

"An edge in a connection."
type ReadingsEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: ReadingReadModel!
}

type ReadingStoredPayload {
  meterId: UUID!
  location: String!
  meterType: String!
  metricCode: String!
  valueNumeric: Decimal
  valueBool: Boolean
  isChanged: Boolean!
  observedAt: DateTime!
}

input AlertOperatorOperationFilterInput {
  eq: AlertOperator @cost(weight: "10")
  neq: AlertOperator @cost(weight: "10")
  in: [AlertOperator!] @cost(weight: "10")
  nin: [AlertOperator!] @cost(weight: "10")
}

input AlertReadModelFilterInput {
  and: [AlertReadModelFilterInput!]
  or: [AlertReadModelFilterInput!]
  id: UuidOperationFilterInput
  ruleId: UuidOperationFilterInput
  meterId: UuidOperationFilterInput
  location: StringOperationFilterInput
  meterType: StringOperationFilterInput
  metricCode: StringOperationFilterInput
  status: AlertStatusOperationFilterInput
  severity: AlertSeverityOperationFilterInput
  triggeredAt: DateTimeOperationFilterInput
  triggeredValueNumeric: DecimalOperationFilterInput
  triggeredValueBool: BooleanOperationFilterInput
  resolvedAt: DateTimeOperationFilterInput
  resolvedValueNumeric: DecimalOperationFilterInput
  resolvedValueBool: BooleanOperationFilterInput
}

input AlertReadModelSortInput {
  id: SortEnumType @cost(weight: "10")
  ruleId: SortEnumType @cost(weight: "10")
  meterId: SortEnumType @cost(weight: "10")
  location: SortEnumType @cost(weight: "10")
  meterType: SortEnumType @cost(weight: "10")
  metricCode: SortEnumType @cost(weight: "10")
  status: SortEnumType @cost(weight: "10")
  severity: SortEnumType @cost(weight: "10")
  triggeredAt: SortEnumType @cost(weight: "10")
  triggeredValueNumeric: SortEnumType @cost(weight: "10")
  triggeredValueBool: SortEnumType @cost(weight: "10")
  resolvedAt: SortEnumType @cost(weight: "10")
  resolvedValueNumeric: SortEnumType @cost(weight: "10")
  resolvedValueBool: SortEnumType @cost(weight: "10")
}

input AlertRuleReadModelFilterInput {
  and: [AlertRuleReadModelFilterInput!]
  or: [AlertRuleReadModelFilterInput!]
  id: UuidOperationFilterInput
  name: StringOperationFilterInput
  location: StringOperationFilterInput
  meterType: StringOperationFilterInput
  metricCode: StringOperationFilterInput
  operator: AlertOperatorOperationFilterInput
  thresholdNumeric: DecimalOperationFilterInput
  thresholdBool: BooleanOperationFilterInput
  severity: AlertSeverityOperationFilterInput
  hysteresisPercent: DecimalOperationFilterInput
  cooldownSeconds: IntOperationFilterInput
  isEnabled: BooleanOperationFilterInput
  lastTriggeredAt: DateTimeOperationFilterInput
  createdAt: DateTimeOperationFilterInput
  updatedAt: DateTimeOperationFilterInput
}

input AlertRuleReadModelSortInput {
  id: SortEnumType @cost(weight: "10")
  name: SortEnumType @cost(weight: "10")
  location: SortEnumType @cost(weight: "10")
  meterType: SortEnumType @cost(weight: "10")
  metricCode: SortEnumType @cost(weight: "10")
  operator: SortEnumType @cost(weight: "10")
  thresholdNumeric: SortEnumType @cost(weight: "10")
  thresholdBool: SortEnumType @cost(weight: "10")
  severity: SortEnumType @cost(weight: "10")
  hysteresisPercent: SortEnumType @cost(weight: "10")
  cooldownSeconds: SortEnumType @cost(weight: "10")
  isEnabled: SortEnumType @cost(weight: "10")
  lastTriggeredAt: SortEnumType @cost(weight: "10")
  createdAt: SortEnumType @cost(weight: "10")
  updatedAt: SortEnumType @cost(weight: "10")
}

input AlertSeverityOperationFilterInput {
  eq: AlertSeverity @cost(weight: "10")
  neq: AlertSeverity @cost(weight: "10")
  in: [AlertSeverity!] @cost(weight: "10")
  nin: [AlertSeverity!] @cost(weight: "10")
}

input AlertStatusOperationFilterInput {
  eq: AlertStatus @cost(weight: "10")
  neq: AlertStatus @cost(weight: "10")
  in: [AlertStatus!] @cost(weight: "10")
  nin: [AlertStatus!] @cost(weight: "10")
}

input BooleanOperationFilterInput {
  eq: Boolean @cost(weight: "10")
  neq: Boolean @cost(weight: "10")
}

input DateTimeOperationFilterInput {
  eq: DateTime @cost(weight: "10")
  neq: DateTime @cost(weight: "10")
  in: [DateTime] @cost(weight: "10")
  nin: [DateTime] @cost(weight: "10")
  gt: DateTime @cost(weight: "10")
  ngt: DateTime @cost(weight: "10")
  gte: DateTime @cost(weight: "10")
  ngte: DateTime @cost(weight: "10")
  lt: DateTime @cost(weight: "10")
  nlt: DateTime @cost(weight: "10")
  lte: DateTime @cost(weight: "10")
  nlte: DateTime @cost(weight: "10")
}

input DecimalOperationFilterInput {
  eq: Decimal @cost(weight: "10")
  neq: Decimal @cost(weight: "10")
  in: [Decimal] @cost(weight: "10")
  nin: [Decimal] @cost(weight: "10")
  gt: Decimal @cost(weight: "10")
  ngt: Decimal @cost(weight: "10")
  gte: Decimal @cost(weight: "10")
  ngte: Decimal @cost(weight: "10")
  lt: Decimal @cost(weight: "10")
  nlt: Decimal @cost(weight: "10")
  lte: Decimal @cost(weight: "10")
  nlte: Decimal @cost(weight: "10")
}

input IntOperationFilterInput {
  eq: Int @cost(weight: "10")
  neq: Int @cost(weight: "10")
  in: [Int] @cost(weight: "10")
  nin: [Int] @cost(weight: "10")
  gt: Int @cost(weight: "10")
  ngt: Int @cost(weight: "10")
  gte: Int @cost(weight: "10")
  ngte: Int @cost(weight: "10")
  lt: Int @cost(weight: "10")
  nlt: Int @cost(weight: "10")
  lte: Int @cost(weight: "10")
  nlte: Int @cost(weight: "10")
}

input LongOperationFilterInput {
  eq: Long @cost(weight: "10")
  neq: Long @cost(weight: "10")
  in: [Long] @cost(weight: "10")
  nin: [Long] @cost(weight: "10")
  gt: Long @cost(weight: "10")
  ngt: Long @cost(weight: "10")
  gte: Long @cost(weight: "10")
  ngte: Long @cost(weight: "10")
  lt: Long @cost(weight: "10")
  nlt: Long @cost(weight: "10")
  lte: Long @cost(weight: "10")
  nlte: Long @cost(weight: "10")
}

input MeterReadModelFilterInput {
  and: [MeterReadModelFilterInput!]
  or: [MeterReadModelFilterInput!]
  id: UuidOperationFilterInput
  location: StringOperationFilterInput
  meterType: StringOperationFilterInput
  firstSeenAt: DateTimeOperationFilterInput
  lastSeenAt: DateTimeOperationFilterInput
}

input MeterReadModelSortInput {
  id: SortEnumType @cost(weight: "10")
  location: SortEnumType @cost(weight: "10")
  meterType: SortEnumType @cost(weight: "10")
  firstSeenAt: SortEnumType @cost(weight: "10")
  lastSeenAt: SortEnumType @cost(weight: "10")
}

input ReadingReadModelFilterInput {
  and: [ReadingReadModelFilterInput!]
  or: [ReadingReadModelFilterInput!]
  id: LongOperationFilterInput
  meterId: UuidOperationFilterInput
  location: StringOperationFilterInput
  meterType: StringOperationFilterInput
  metricCode: StringOperationFilterInput
  observedAt: DateTimeOperationFilterInput
  valueNumeric: DecimalOperationFilterInput
  valueBool: BooleanOperationFilterInput
  isChanged: BooleanOperationFilterInput
}

input ReadingReadModelSortInput {
  id: SortEnumType @cost(weight: "10")
  meterId: SortEnumType @cost(weight: "10")
  location: SortEnumType @cost(weight: "10")
  meterType: SortEnumType @cost(weight: "10")
  metricCode: SortEnumType @cost(weight: "10")
  observedAt: SortEnumType @cost(weight: "10")
  valueNumeric: SortEnumType @cost(weight: "10")
  valueBool: SortEnumType @cost(weight: "10")
  isChanged: SortEnumType @cost(weight: "10")
}

input StringOperationFilterInput {
  and: [StringOperationFilterInput!]
  or: [StringOperationFilterInput!]
  eq: String @cost(weight: "10")
  neq: String @cost(weight: "10")
  contains: String @cost(weight: "20")
  ncontains: String @cost(weight: "20")
  in: [String] @cost(weight: "10")
  nin: [String] @cost(weight: "10")
  startsWith: String @cost(weight: "20")
  nstartsWith: String @cost(weight: "20")
  endsWith: String @cost(weight: "20")
  nendsWith: String @cost(weight: "20")
}

input UuidOperationFilterInput {
  eq: UUID @cost(weight: "10")
  neq: UUID @cost(weight: "10")
  in: [UUID] @cost(weight: "10")
  nin: [UUID] @cost(weight: "10")
  gt: UUID @cost(weight: "10")
  ngt: UUID @cost(weight: "10")
  gte: UUID @cost(weight: "10")
  ngte: UUID @cost(weight: "10")
  lt: UUID @cost(weight: "10")
  nlt: UUID @cost(weight: "10")
  lte: UUID @cost(weight: "10")
  nlte: UUID @cost(weight: "10")
}

enum AggregationBucketSize {
  MINUTE
  HOUR
  DAY
}

enum AlertOperator {
  GT
  GTE
  LT
  LTE
  EQ
}

enum AlertSeverity {
  INFO
  WARNING
  CRITICAL
}

enum AlertStatus {
  ACTIVE
  RESOLVED
}

"Defines when a policy shall be executed."
enum ApplyPolicy {
  "Before the resolver was executed."
  BEFORE_RESOLVER
  "After the resolver was executed."
  AFTER_RESOLVER
  "The policy is applied in the validation step before the execution."
  VALIDATION
}

enum SortEnumType {
  ASC
  DESC
}

"The `DateTime` scalar type represents a date and time with time zone offset information."
scalar DateTime
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/date-time.html")

"The `Decimal` scalar type represents a decimal floating-point number with high precision."
scalar Decimal
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/decimal.html")

"The `Long` scalar type represents a signed 64-bit integer."
scalar Long
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/long.html")

"The `UUID` scalar type represents a Universally Unique Identifier (UUID) as defined by RFC 9562."
scalar UUID
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/uuid.html")

"The authorize directive."
directive @authorize(
  "The name of the authorization policy that determines access to the annotated resource."
  policy: String
  "Roles that are allowed to access the annotated resource."
  roles: [String!]
  "Defines when the authorize directive shall be applied. By default the authorize directive is applied before the resolver is executed."
  apply: ApplyPolicy! = BEFORE_RESOLVER
) repeatable on OBJECT | FIELD_DEFINITION

"The purpose of the `cost` directive is to define a `weight` for GraphQL types, fields, and arguments. Static analysis can use these weights when calculating the overall cost of a query or response."
directive @cost(
  "The `weight` argument defines what value to add to the overall cost for every appearance, or possible appearance, of a type, field, argument, etc."
  weight: String!
) on
  | SCALAR
  | OBJECT
  | FIELD_DEFINITION
  | ARGUMENT_DEFINITION
  | ENUM
  | INPUT_FIELD_DEFINITION

"The purpose of the `@listSize` directive is to either inform the static analysis about the size of returned lists (if that information is statically available), or to point the analysis to where to find that information."
directive @listSize(
  "The `assumedSize` argument can be used to statically define the maximum length of a list returned by a field."
  assumedSize: Int
  "The `slicingArguments` argument can be used to define which of the field's arguments with numeric type are slicing arguments, so that their value determines the size of the list returned by that field. It may specify a list of multiple slicing arguments."
  slicingArguments: [String!]
  "The `slicingArgumentDefaultValue` argument can be used to define a default value for a slicing argument, which is used if the argument is not present in a query."
  slicingArgumentDefaultValue: Int
  "The `sizedFields` argument can be used to define that the value of the `assumedSize` argument or of a slicing argument does not affect the size of a list returned by a field itself, but that of a list returned by one of its sub-fields."
  sizedFields: [String!]
  "The `requireOneSlicingArgument` argument can be used to inform the static analysis that it should expect that exactly one of the defined slicing arguments is present in a query. If that is not the case (i.e., if none or multiple slicing arguments are present), the static analysis may throw an error."
  requireOneSlicingArgument: Boolean = true
) on FIELD_DEFINITION